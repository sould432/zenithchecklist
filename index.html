<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>퇴근 체크리스트</title>

  <style>
    *{
      box-sizing:border-box;
      font-family:'Pretendard', sans-serif;
    }

    body{
      margin:0;
      background:#f4f6f8;
      padding:20px;
      color:#222;
    }

    .container{
      max-width:700px;
      margin:auto;
      background:white;
      border-radius:20px;
      padding:24px;
      box-shadow:0 8px 30px rgba(0,0,0,0.08);
    }

    h1{
      text-align:center;
      margin-bottom:10px;
    }

    .date{
      text-align:center;
      color:#6b7280;
      margin-bottom:24px;
      font-size:14px;
    }

    .progress-box{
      margin-bottom:24px;
    }

    .progress-text{
      margin-bottom:8px;
      font-weight:600;
    }

    .progress-bar{
      width:100%;
      height:14px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
    }

    .progress{
      height:100%;
      width:0%;
      background:#4f46e5;
      transition:0.3s;
    }

    .section{
      margin-bottom:22px;
      padding:16px;
      border-radius:16px;
      background:#f9fafb;
    }

    .section-title{
      font-size:18px;
      font-weight:700;
      margin-bottom:12px;
    }

    .sub-title{
      font-size:15px;
      font-weight:600;
      margin-bottom:8px;
      margin-top:8px;
      color:#374151;
    }

    label{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 0;
      cursor:pointer;
    }

    input[type="checkbox"]{
      width:18px;
      height:18px;
    }

    .sub{
      margin-left:26px;
      margin-top:4px;
    }

    button{
      width:100%;
      border:none;
      background:#111827;
      color:white;
      padding:14px;
      border-radius:14px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      margin-top:12px;
      transition:0.2s;
    }

    button:hover{
      opacity:0.9;
    }

    .reset-btn{
      background:#6b7280;
    }

    .done{
      text-decoration:line-through;
      opacity:0.55;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>퇴근 체크리스트</h1>

    <div class="date" id="today"></div>

    <div class="progress-box">

      <div class="progress-text">
        진행률: <span id="progressText">0%</span>
      </div>

      <div class="progress-bar">
        <div class="progress" id="progressBar"></div>
      </div>

    </div>

    <div class="section">

      <div class="section-title">기본 업무</div>

      <label>
        <input type="checkbox" class="check">
        <span>일지 & 카톡 정독</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>다음날 프린트 확인 & 세팅</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>퇴근문자 보내기</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>착신전환</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>학원버스 태블릿 / 토스 단말기 끄기</span>
      </label>

    </div>

    <div class="section">

      <div class="section-title">전원 관리</div>

      <div class="sub-title">
        난로 / 에어컨 끄기
      </div>

      <div class="sub">

        <label>
          <input type="checkbox" class="check">
          <span>중앙 에어컨</span>
        </label>

        <label>
          <input type="checkbox" class="check">
          <span>2강의실 에어컨</span>
        </label>

        <label>
          <input type="checkbox" class="check">
          <span>중앙 히터</span>
        </label>
        
        <label>
          <input type="checkbox" class="check">
          <span>제습기 끄기</span>
        </label>
        
      </div>

    </div>

    <div class="section">

      <div class="section-title">청소</div>

      <label>
        <input type="checkbox" class="check">
        <span>쓸기 / 닦기</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>화장실 청소</span>
      </label>
      
      <label>
        <input type="checkbox" class="check">
        <span>화장지, 핸드타올 부족한지 확인</span>
      </label>

    </div>

    <div class="section">

      <div class="section-title">퇴근 확인</div>
      
      <label>
        <input type="checkbox" class="check">
        <span>컴퓨터 끄기</span>
      </label>
      
      <label>
        <input type="checkbox" class="check">
        <span>퇴근카드 찍기</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>물건 확인</span>
      </label>

    </div>

    <div class="section">

      <div class="section-title">전등 확인</div>
      
      <label>
        <input type="checkbox" class="check">
        <span>중앙</span>
      </label>
      
      <label>
        <input type="checkbox" class="check">
        <span>1강의실</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>2강의실</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>상담실</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>1자습실</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>2자습실</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>인쇄실</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>복도</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>화장실</span>
      </label>

    </div>

    <div class="section">

      <div class="section-title">마지막 확인</div>

      <label>
        <input type="checkbox" class="check">
        <span>문 잠그기</span>
      </label>

      <label>
        <input type="checkbox" class="check">
        <span>1층 불 끄기</span>
      </label>

    </div>

    <button onclick="completeChecklist()">
      퇴근 완료
    </button>

    <button
      class="reset-btn"
      onclick="resetChecklist()">
      체크 초기화
    </button>

  </div>

  <script>

    const checks =
      document.querySelectorAll('.check');

    const progressBar =
      document.getElementById('progressBar');

    const progressText =
      document.getElementById('progressText');

    // 오늘 날짜
    const today = new Date();

    const todayString =
      today.getFullYear() + '-' +
      String(today.getMonth()+1).padStart(2,'0') + '-' +
      String(today.getDate()).padStart(2,'0');

    document.getElementById('today').innerText =
      '오늘 날짜 : ' + todayString;

    // 진행률 업데이트
    function updateProgress(){

      const total = checks.length;

      let checked = 0;

      checks.forEach(check => {

        const text =
          check.parentElement.querySelector('span');

        if(check.checked){

          checked++;

          text.classList.add('done');

        }else{

          text.classList.remove('done');

        }

      });

      const percent =
        Math.round((checked / total) * 100);

      progressBar.style.width =
        percent + '%';

      progressText.innerText =
        percent + '%';

      saveChecklist();

    }

    // 저장
    function saveChecklist(){

      const data = {

        date: todayString,

        checks:
          [...checks].map(
            c => c.checked
          )

      };

      localStorage.setItem(
        'checklistData',
        JSON.stringify(data)
      );

    }

    // 불러오기
    function loadChecklist(){

      const saved =
        JSON.parse(
          localStorage.getItem('checklistData')
        );

      if(!saved){

        updateProgress();

        return;

      }

      // 날짜 바뀌면 자동 초기화
      if(saved.date !== todayString){

        localStorage.removeItem(
          'checklistData'
        );

        checks.forEach(check => {
          check.checked = false;
        });

      }else{

        checks.forEach((check, i) => {

          check.checked =
            saved.checks[i];

        });

      }

      updateProgress();

    }

    // 수동 초기화
    function resetChecklist(){

      checks.forEach(check => {
        check.checked = false;
      });

      updateProgress();

    }

    // 퇴근 완료 버튼
    function completeChecklist(){

      const unchecked =
        [...checks].filter(
          check => !check.checked
        ).length;

      if(unchecked > 0){

        alert(
          unchecked +
          '개 항목이 완료되지 않았습니다!'
        );

      }else{

        alert(
          '퇴근 완료! 도비는 자유에요!'
        );

      }

    }

    // 체크 이벤트
    checks.forEach(check => {

      check.addEventListener(
        'change',
        updateProgress
      );

    });

    loadChecklist();

  </script>

</body>
</html>
